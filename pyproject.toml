[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-masked"
version = "1.0.0"
description = "Локальное обезличивание документов перед отправкой в LLM и обратная подстановка после ответа"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kirill Pshinnik"}]
keywords = ["pii", "redaction", "anonymization", "llm", "privacy", "gdpr", "docx", "pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
docs = ["python-docx>=1.1", "openpyxl>=3.1", "PyMuPDF>=1.24", "beautifulsoup4>=4.12", "charset-normalizer>=3"]
llm = ["anthropic>=0.40", "openai>=1.40"]
all = ["python-docx>=1.1", "openpyxl>=3.1", "PyMuPDF>=1.24", "beautifulsoup4>=4.12",
       "cryptography>=42", "rich>=13", "charset-normalizer>=3", "markdown>=3.5",
       "anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/kpshinnik/docs_masked"
Issues = "https://github.com/kpshinnik/docs_masked/issues"

[project.scripts]
docs-masked = "pii_shield.cli:main"
pii-shield = "pii_shield.cli:main"

[tool.setuptools.packages.find]
include = ["pii_shield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
